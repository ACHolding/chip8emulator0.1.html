<html lang="en">
<head>

<title>CATSDK CHIP-8 Emulator</title>

<style>
    * {

    }

    body {

<body>

<div class="app">

    <h1>CATSDK CHIP-8 Emulator</h1>

    <div class="help">
        Keyboard mapping:<br>

        Q W E R → 4 5 6 D<br>
        A S D F → 7 8 9 E<br>
        Z X C V → A 0 B F
    </div>

</div>

<script>
"use strict";

class Chip8 {

    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");

        this.memory = new Uint8Array(4096);
        this.V = new Uint8Array(16);

        this.I = 0;
        this.pc = 0x200;

        this.stack = new Uint16Array(16);
        this.sp = 0;

        this.delayTimer = 0;
        this.soundTimer = 0;

        this.keys = new Uint8Array(16);
        this.display = new Uint8Array(64 * 32);

        this.waitingForKey = false;
        this.waitingRegister = 0;

        this.running = false;

        this.font = new Uint8Array([
            0xF0,0x90,0x90,0x90,0xF0,
            0x20,0x60,0x20,0x20,0x70,
            0xF0,0x10,0xF0,0x80,0xF0,
            0xF0,0x10,0xF0,0x10,0xF0,
            0x90,0x90,0xF0,0x10,0x10,
            0xF0,0x80,0xF0,0x10,0xF0,
            0xF0,0x80,0xF0,0x90,0xF0,
            0xF0,0x10,0x20,0x40,0x40,
            0xF0,0x90,0xF0,0x90,0xF0,
            0xF0,0x90,0xF0,0x10,0xF0,
            0xF0,0x90,0xF0,0x90,0x90,
            0xE0,0x90,0xE0,0x90,0xE0,
            0xF0,0x80,0x80,0x80,0xF0,
            0xE0,0x90,0x90,0x90,0xE0,
            0xF0,0x80,0xF0,0x80,0xF0,
            0xF0,0x80,0xF0,0x80,0x80
        ]);

        this.reset();
    }

    reset() {
        this.memory.fill(0);
        this.V.fill(0);
        this.stack.fill(0);
        this.keys.fill(0);
        this.display.fill(0);

        this.I = 0;
        this.pc = 0x200;
        this.sp = 0;

        this.delayTimer = 0;
        this.soundTimer = 0;

        this.waitingForKey = false;
        this.waitingRegister = 0;

        this.memory.set(this.font, 0x50);

        this.draw();
    }

    loadROM(data) {
        this.reset();

        if (data.length > 4096 - 0x200) {
            throw new Error("ROM is too large for CHIP-8 memory.");
        }

        this.memory.set(data, 0x200);

        this.running = true;
    }

    cycle() {

        if (!this.running || this.waitingForKey)
            return;

        const opcode =
            (this.memory[this.pc] << 8) |
            this.memory[this.pc + 1];

        this.pc += 2;

        const nnn = opcode & 0x0FFF;
        const nn  = opcode & 0x00FF;
        const n   = opcode & 0x000F;

        const x = (opcode >> 8) & 0x0F;
        const y = (opcode >> 4) & 0x0F;

        switch (opcode & 0xF000) {

            case 0x0000:

                if (opcode === 0x00E0) {

                    this.display.fill(0);
                    this.draw();

                } else if (opcode === 0x00EE) {

                    this.sp--;
                    this.pc = this.stack[this.sp];

                }

                break;


            case 0x1000:

                this.pc = nnn;
                break;


            case 0x2000:

                this.stack[this.sp] = this.pc;
                this.sp++;

                this.pc = nnn;
                break;


            case 0x3000:

                if (this.V[x] === nn)
                    this.pc += 2;

                break;


            case 0x4000:

                if (this.V[x] !== nn)
                    this.pc += 2;

                break;


            case 0x5000:

                if (n === 0 && this.V[x] === this.V[y])
                    this.pc += 2;

                break;


            case 0x6000:

                this.V[x] = nn;
                break;


            case 0x7000:

                this.V[x] = (this.V[x] + nn) & 0xFF;
                break;


            case 0x8000:

                switch (n) {

                    case 0x0:
                        this.V[x] = this.V[y];
                        break;

                    case 0x1:
                        this.V[x] |= this.V[y];
                        break;

                    case 0x2:
                        this.V[x] &= this.V[y];
                        break;

                    case 0x3:
                        this.V[x] ^= this.V[y];
                        break;

                    case 0x4: {
                        const result = this.V[x] + this.V[y];

                        this.V[0xF] = result > 255 ? 1 : 0;
                        this.V[x] = result & 0xFF;

                        break;
                    }

                    case 0x5:

                        this.V[0xF] =
                            this.V[x] >= this.V[y]
                            ? 1
                            : 0;

                        this.V[x] =
                            (this.V[x] - this.V[y]) & 0xFF;

                        break;

                    case 0x6:

                        this.V[0xF] = this.V[x] & 1;
                        this.V[x] >>= 1;

                        break;

                    case 0x7:

                        this.V[0xF] =
                            this.V[y] >= this.V[x]
                            ? 1
                            : 0;

                        this.V[x] =
                            (this.V[y] - this.V[x]) & 0xFF;

                        break;

                    case 0xE:

                        this.V[0xF] =
                            (this.V[x] >> 7) & 1;

                        this.V[x] =
                            (this.V[x] << 1) & 0xFF;

                        break;
                }

                break;


            case 0x9000:

                if (n === 0 && this.V[x] !== this.V[y])
                    this.pc += 2;

                break;


            case 0xA000:

                this.I = nnn;
                break;


            case 0xB000:

                this.pc = nnn + this.V[0];
                break;


            case 0xC000:

                this.V[x] =
                    (Math.floor(Math.random() * 256)) & nn;

                break;


            case 0xD000: {

                const vx = this.V[x] % 64;
                const vy = this.V[y] % 32;

                this.V[0xF] = 0;

                for (let row = 0; row < n; row++) {

                    const spriteByte =
                        this.memory[this.I + row];

                    for (let bit = 0; bit < 8; bit++) {

                        if (
                            (spriteByte &
                            (0x80 >> bit)) !== 0
                        ) {

                            const px =
                                (vx + bit) % 64;

                            const py =
                                (vy + row) % 32;

                            const index =
                                px + py * 64;

                            if (this.display[index] === 1)
                                this.V[0xF] = 1;

                            this.display[index] ^= 1;
                        }
                    }
                }

                this.draw();

                break;
            }


            case 0xE000:

                if (
                    nn === 0x9E &&
                    this.keys[this.V[x]]
                ) {

                    this.pc += 2;

                } else if (
                    nn === 0xA1 &&
                    !this.keys[this.V[x]]
                ) {

                    this.pc += 2;
                }

                break;


            case 0xF000:

                switch (nn) {

                    case 0x07:

                        this.V[x] =
                            this.delayTimer;

                        break;


                    case 0x0A:

                        this.waitingForKey = true;
                        this.waitingRegister = x;

                        break;


                    case 0x15:

                        this.delayTimer =
                            this.V[x];

                        break;


                    case 0x18:

                        this.soundTimer =
                            this.V[x];

                        break;


                    case 0x1E:

                        this.I =
                            (this.I + this.V[x]) & 0xFFF;

                        break;


                    case 0x29:

                        this.I =
                            0x50 + this.V[x] * 5;

                        break;


                    case 0x33: {

                        const value = this.V[x];

                        this.memory[this.I] =
                            Math.floor(value / 100);

                        this.memory[this.I + 1] =
                            Math.floor(
                                (value % 100) / 10
                            );

                        this.memory[this.I + 2] =
                            value % 10;

                        break;
                    }


                    case 0x55:

                        for (
                            let i = 0;
                            i <= x;
                            i++
                        ) {
                            this.memory[this.I + i] =
                                this.V[i];
                        }

                        break;


                    case 0x65:

                        for (
                            let i = 0;
                            i <= x;
                            i++
                        ) {
                            this.V[i] =
                                this.memory[this.I + i];
                        }

                        break;
                }

                break;


            default:

                console.warn(
                    "Unknown opcode:",
                    opcode.toString(16)
                );

                break;
        }
    }


    tickTimers() {

        if (this.delayTimer > 0)
            this.delayTimer--;

        if (this.soundTimer > 0) {

            this.soundTimer--;

            if (this.soundTimer === 0) {
                this.beep();
            }
        }
    }


    keyDown(keyIndex) {

        this.keys[keyIndex] = 1;

        if (this.waitingForKey) {

            this.V[this.waitingRegister] =
                keyIndex;

            this.waitingForKey = false;
        }
    }


    keyUp(keyIndex) {

        this.keys[keyIndex] = 0;
    }


    draw() {

        const image =
            this.ctx.createImageData(64, 32);

        for (
            let i = 0;
            i < this.display.length;
            i++
        ) {

            const on = this.display[i];

            const p = i * 4;

            image.data[p] =
                on ? 102 : 0;

            image.data[p + 1] =
                on ? 204 : 0;

            image.data[p + 2] =
                on ? 255 : 0;

            image.data[p + 3] = 255;
        }

        this.ctx.putImageData(image, 0, 0);
    }


    beep() {

        try {

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            const audio =
                new AudioCtx();

            const osc =
                audio.createOscillator();

            const gain =
                audio.createGain();

            osc.type = "square";
            osc.frequency.value = 440;

            gain.gain.value = 0.08;

            osc.connect(gain);
            gain.connect(audio.destination);

            osc.start();

            setTimeout(() => {

                osc.stop();
                audio.close();

            }, 80);

        } catch (_) {}
    }
}



const canvas =
    document.getElementById("screen");

const chip8 =
    new Chip8(canvas);


const romInput =
    document.getElementById("romInput");

const resetBtn =
    document.getElementById("resetBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const speedSlider =
    document.getElementById("speed");

const speedText =
    document.getElementById("speedText");

const status =
    document.getElementById("status");


let loadedROM = null;

let paused = false;

let cyclesPerFrame =
    Number(speedSlider.value);


speedSlider.addEventListener(
    "input",
    () => {

        cyclesPerFrame =
            Number(speedSlider.value);

        speedText.textContent =
            cyclesPerFrame;
    }
);


romInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file)
            return;

        const buffer =
            await file.arrayBuffer();

        loadedROM =
            new Uint8Array(buffer);

        try {

            chip8.loadROM(loadedROM);

            paused = false;

            pauseBtn.textContent =
                "Pause";

            status.textContent =
                "Loaded: " +
                file.name +
                " (" +
                file.size +
                " bytes)";

        } catch (error) {

            status.textContent =
                "Error: " +
                error.message;
        }
    }
);


resetBtn.addEventListener(
    "click",
    () => {

        if (loadedROM) {

            chip8.loadROM(loadedROM);

            status.textContent =
                "ROM reset.";

        } else {

            chip8.reset();

            status.textContent =
                "No ROM loaded.";
        }
    }
);


pauseBtn.addEventListener(
    "click",
    () => {

        paused = !paused;

        pauseBtn.textContent =
            paused
            ? "Resume"
            : "Pause";
    }
);



const keyMap = {

    "1": 0x1,
    "2": 0x2,
    "3": 0x3,
    "4": 0xC,

    "q": 0x4,
    "w": 0x5,
    "e": 0x6,
    "r": 0xD,

    "a": 0x7,
    "s": 0x8,
    "d": 0x9,
    "f": 0xE,

    "z": 0xA,
    "x": 0x0,
    "c": 0xB,
    "v": 0xF

};


function updateVisualKey(
    index,
    active
) {

    const hex =
        index
        .toString(16)
        .toUpperCase();

    const element =
        document.querySelector(
            `[data-key="${hex}"]`
        );

    if (element)
        element.classList.toggle(
            "active",
            active
        );
}


window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        if (key in keyMap) {

            event.preventDefault();

            const index =
                keyMap[key];

            chip8.keyDown(index);

            updateVisualKey(
                index,
                true
            );
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        if (key in keyMap) {

            event.preventDefault();

            const index =
                keyMap[key];

            chip8.keyUp(index);

            updateVisualKey(
                index,
                false
            );
        }
    }
);



let lastTimerTime =
    performance.now();


function mainLoop(now) {

    if (
        chip8.running &&
        !paused
    ) {

        for (
            let i = 0;
            i < cyclesPerFrame;
            i++
        ) {

            chip8.cycle();
        }

        if (
            now - lastTimerTime >=
            1000 / 60
        ) {

            chip8.tickTimers();

            lastTimerTime = now;
        }
    }

    requestAnimationFrame(mainLoop);
}


chip8.draw();

requestAnimationFrame(mainLoop);

</script>

</body>
</html>
